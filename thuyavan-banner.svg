<svg width="100%" height="220" viewBox="0 0 1200 220" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f0c29">
        <animate attributeName="stop-color" values="#0f0c29;#302b63;#24243e;#0f0c29" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="50%" stop-color="#302b63">
        <animate attributeName="stop-color" values="#302b63;#3a0ca3;#7209b7;#302b63" dur="8s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#24243e">
        <animate attributeName="stop-color" values="#24243e;#0f0c29;#3a0ca3;#24243e" dur="8s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="50%" stop-color="#ff2fb3"/>
      <stop offset="100%" stop-color="#00e5ff"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <style>
      .star { animation: twinkle 2.5s infinite ease-in-out; }
      .star:nth-child(2){ animation-delay: .4s }
      .star:nth-child(3){ animation-delay: .8s }
      .star:nth-child(4){ animation-delay: 1.2s }
      .star:nth-child(5){ animation-delay: 1.6s }
      @keyframes twinkle { 0%,100%{ opacity:.15; } 50%{ opacity:1; } }
      .float { animation: floaty 3s ease-in-out infinite; }
      @keyframes floaty { 0%,100%{ transform: translateY(0px);} 50%{ transform: translateY(-6px);} }
      .cursor { animation: blink 1s step-end infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      text.type { font-family: 'Courier New', monospace; }
    </style>
  </defs>

  <rect width="1200" height="220" rx="18" fill="url(#bgGrad)"/>

  <!-- twinkling stars -->
  <circle class="star" cx="60" cy="40" r="2" fill="#ffffff"/>
  <circle class="star" cx="1120" cy="60" r="2.5" fill="#ffffff"/>
  <circle class="star" cx="150" cy="170" r="1.8" fill="#ffffff"/>
  <circle class="star" cx="1050" cy="180" r="2" fill="#ffffff"/>
  <circle class="star" cx="600" cy="30" r="1.5" fill="#ffffff"/>

  <!-- floating code brackets -->
  <text class="float" x="40" y="130" font-size="70" fill="#ff2fb3" opacity="0.25" font-family="monospace">&lt;/&gt;</text>
  <text class="float" x="1050" y="150" font-size="60" fill="#00e5ff" opacity="0.25" font-family="monospace">{ }</text>

  <text x="600" y="105" text-anchor="middle" font-size="46" font-weight="700"
        font-family="'Segoe UI', Verdana, sans-serif" fill="url(#textGrad)" filter="url(#glow)">
    Hi, I'm Thuyavan M 👋
  </text>

  <text x="600" y="150" text-anchor="middle" class="type" font-size="22" fill="#c9d1d9">
    MERN Stack Developer &#8226; AI/LLM Builder &#8226; CSE Undergrad
    <tspan class="cursor" fill="#00e5ff">|</tspan>
  </text>

  <text x="600" y="185" text-anchor="middle" font-size="15" fill="#8b949e" font-family="monospace">
    🏆 1st Prize @ Kings Engineering College Expo &#8226; 20+ competing teams
  </text>
</svg>
