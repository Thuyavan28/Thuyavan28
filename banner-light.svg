<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="200" viewBox="0 0 1200 200" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      @keyframes reactSpin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .react-spin { transform-origin: 90px 100px; animation: reactSpin 8s linear infinite; }
    </style>
  </defs>

  <!-- BASE BACKGROUND -->
  <rect width="1200" height="200" rx="14" fill="#EFF6FF"/>

  <!-- BG LAYER 1: grid lines -->
  <line x1="0" y1="40"  x2="1200" y2="40"  stroke="#BFDBFE" stroke-width="1"/>
  <line x1="0" y1="80"  x2="1200" y2="80"  stroke="#BFDBFE" stroke-width="1"/>
  <line x1="0" y1="120" x2="1200" y2="120" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="0" y1="160" x2="1200" y2="160" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="100"  y1="0" x2="100"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="200"  y1="0" x2="200"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="300"  y1="0" x2="300"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="400"  y1="0" x2="400"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="500"  y1="0" x2="500"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="600"  y1="0" x2="600"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="700"  y1="0" x2="700"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="800"  y1="0" x2="800"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="900"  y1="0" x2="900"  y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="1000" y1="0" x2="1000" y2="200" stroke="#BFDBFE" stroke-width="1"/>
  <line x1="1100" y1="0" x2="1100" y2="200" stroke="#BFDBFE" stroke-width="1"/>

  <!-- BG LAYER 2: faint code snippets -->
  <text x="20"  y="22"  font-family="'Courier New',monospace" font-size="11" fill="#BFDBFE">const App = () =&gt; &lt;Router /&gt;</text>
  <text x="820" y="22"  font-family="'Courier New',monospace" font-size="11" fill="#BFDBFE">npm run build --prod</text>
  <text x="20"  y="185" font-family="'Courier New',monospace" font-size="11" fill="#BFDBFE">docker compose up -d</text>
  <text x="800" y="185" font-family="'Courier New',monospace" font-size="11" fill="#BFDBFE">git push origin main</text>
  <text x="350" y="18"  font-family="'Courier New',monospace" font-size="10" fill="#C7D2FE">useEffect(() =&gt; { fetchData() }, [])</text>
  <text x="430" y="192" font-family="'Courier New',monospace" font-size="10" fill="#C7D2FE">JWT.verify(token, SECRET_KEY)</text>

  <!-- BG LAYER 3: nodes -->
  <circle cx="180" cy="55"  r="2.5" fill="#93C5FD" opacity="0.8"/>
  <circle cx="310" cy="145" r="2"   fill="#93C5FD" opacity="0.7"/>
  <circle cx="460" cy="35"  r="3"   fill="#1D4ED8" opacity="0.2"/>
  <circle cx="570" cy="170" r="2"   fill="#93C5FD" opacity="0.7"/>
  <circle cx="740" cy="50"  r="2.5" fill="#93C5FD" opacity="0.8"/>
  <circle cx="880" cy="155" r="2"   fill="#1D4ED8" opacity="0.2"/>
  <circle cx="990" cy="40"  r="3"   fill="#93C5FD" opacity="0.7"/>
  <circle cx="1060" cy="130" r="2"  fill="#93C5FD" opacity="0.6"/>

  <!-- BG LAYER 4: connector lines -->
  <line x1="180" y1="55"  x2="310" y2="145" stroke="#BFDBFE" stroke-width="1" opacity="0.8"/>
  <line x1="310" y1="145" x2="460" y2="35"  stroke="#BFDBFE" stroke-width="1" opacity="0.8"/>
  <line x1="740" y1="50"  x2="880" y2="155" stroke="#BFDBFE" stroke-width="1" opacity="0.8"/>
  <line x1="880" y1="155" x2="990" y2="40"  stroke="#BFDBFE" stroke-width="1" opacity="0.8"/>

  <!-- BG LAYER 5: soft blobs -->
  <circle cx="200"  cy="100" r="90" fill="#DBEAFE" opacity="0.5"/>
  <circle cx="1000" cy="100" r="90" fill="#DBEAFE" opacity="0.5"/>
  <circle cx="600"  cy="100" r="120" fill="#EFF6FF" opacity="0.4"/>

  <!-- REACT LOGO -->
  <g class="react-spin">
    <ellipse cx="90" cy="100" rx="60" ry="22" fill="none" stroke="#0EA5E9" stroke-width="2.5"/>
    <ellipse cx="90" cy="100" rx="60" ry="22" fill="none" stroke="#0EA5E9" stroke-width="2.5" transform="rotate(60 90 100)"/>
    <ellipse cx="90" cy="100" rx="60" ry="22" fill="none" stroke="#0EA5E9" stroke-width="2.5" transform="rotate(120 90 100)"/>
  </g>
  <circle cx="90" cy="100" r="8" fill="#0EA5E9"/>

  <!-- { } -->
  <text x="1068" y="122" font-family="'Courier New',monospace" font-size="80" font-weight="700" fill="#0EA5E9" opacity="0.1">{ }</text>

  <!-- Name -->
  <text x="600" y="72"
    font-family="'Segoe UI',Arial,sans-serif"
    font-size="42" font-weight="700"
    fill="#0F172A" text-anchor="middle" letter-spacing="1.5">Thuyavan M</text>

  <!-- Subtitle -->
  <text x="600" y="107"
    font-family="'Segoe UI',Arial,sans-serif"
    font-size="15" fill="#475569" text-anchor="middle" letter-spacing="0.5">
    MERN Stack Developer  •  AI / LLM Engineer  •  CSE Undergraduate
  </text>

  <!-- Code line -->
  <text x="600" y="133"
    font-family="'Courier New',Courier,monospace"
    font-size="13" fill="#1D4ED8"
    text-anchor="middle">const role = "Building production-grade full-stack apps";</text>

  <!-- Badge 1 -->
  <rect x="353" y="152" width="196" height="26" rx="13" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
  <text x="451" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">🥇 Kings Engg College Expo 2026</text>

  <!-- Badge 2 -->
  <rect x="563" y="152" width="264" height="26" rx="13" fill="#DBEAFE" stroke="#1D4ED8" stroke-width="1"/>
  <text x="695" y="169" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#1D4ED8" text-anchor="middle">🏆 Saveetha Engg College Hackathon 2026</text>

</svg>
