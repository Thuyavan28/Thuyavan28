<svg width="340" height="500" viewBox="0 0 340 500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="strapG" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff2fb3"/>
      <stop offset="100%" stop-color="#7209b7"/>
    </linearGradient>
    <linearGradient id="cardBgG" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#2b0a4a"/>
    </linearGradient>
    <radialGradient id="ringG" cx="50%" cy="50%" r="50%">
      <stop offset="82%" stop-color="#1b1030"/>
      <stop offset="100%" stop-color="#00e5ff"/>
    </radialGradient>
    <style>
      .swingWrap{transform-origin:170px 20px;animation:sway 3.4s ease-in-out infinite}
      @keyframes sway{0%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}100%{transform:rotate(-5deg)}}
      .glintBar{animation:shine 3.4s ease-in-out infinite}
      @keyframes shine{0%,42%,100%{opacity:0}48%{opacity:.5}54%{opacity:0}}
      .statusDot{animation:pulseS 2.2s ease-in-out infinite}
      @keyframes pulseS{0%,100%{opacity:.5}50%{opacity:1}}
    </style>
  </defs>

  <g class="swingWrap">
    <rect x="155" y="0" width="30" height="130" fill="url(#strapG)" rx="5"/>
    <rect x="155" y="30" width="30" height="6" fill="#ffffff" opacity="0.25"/>
    <rect x="155" y="70" width="30" height="6" fill="#ffffff" opacity="0.25"/>

    <rect x="150" y="124" width="40" height="18" rx="5" fill="#d9d9d9"/>
